<!DOCTYPE html>
<html>
<head>
    <title>Frieren Sobel Edge Detection</title>
    <style>
        body { text-align: center; background: #1a1a1a; color: #eee; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        video, canvas { border: 2px solid #333; background: black; width: 540px; height: 300px; border-radius: 4px; }
        .label { margin-bottom: 10px; font-weight: bold; color: #00d1b2; }
    </style>
</head>
<body>
    <h1>Video Edge Detection (Sobel Operator)</h1>
    <div class="container">
        <div>
            <div class="label">Original Video</div>
            <video id="myvideo" controls autoplay muted loop width="480">
                <source src="frieren_trailer.mp4" type="video/mp4">
            </video>
        </div>
        <div>
            <div class="label">Sobel Edge Output</div>
            <canvas id="mycanvas"></canvas>
        </div>
    </div>

    <script>
        const video = document.getElementById('myvideo');
        const canvas = document.getElementById('mycanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        };

        video.addEventListener('play', () => {
            render();
        });

        function render() {
            if (video.paused || video.ended) return;

            // Vẽ video lên canvas tạm để lấy dữ liệu
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const inputData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const outputData = ctx.createImageData(canvas.width, canvas.height);
            
            const pixels = inputData.data;
            const outputPixels = outputData.data;
            const w = canvas.width;
            const h = canvas.height;

            // Chuyển sang Grayscale (rgb2gray)
            const grayData = new Uint8Array(w * h);
            for (let i = 0; i < pixels.length; i += 4) {
                grayData[i / 4] = 0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2];
            }

            // Kernel Sobel (Gx, Gy)
            const Gx = [
                [-1, 0, 1],
                [-2, 0, 2],
                [-1, 0, 1]
            ];
            const Gy = [
                [-1, -2, -1],
                [ 0,  0,  0],
                [ 1,  2,  1]
            ];

            // Tích chập và tính Gradient Magnitude
            for (let y = 1; y < h - 1; y++) {
                for (let x = 1; x < w - 1; x++) {
                    let valX = 0;
                    let valY = 0;

                    // Convolution 3x3
                    for (let ky = -1; ky <= 1; ky++) {
                        for (let kx = -1; kx <= 1; kx++) {
                            const pixel = grayData[(y + ky) * w + (x + kx)];
                            valX += pixel * Gx[ky + 1][kx + 1];
                            valY += pixel * Gy[ky + 1][kx + 1];
                        }
                    }

                    // G = sqrt(Gx^2 + Gy^2)
                    let magnitude = Math.sqrt(valX * valX + valY * valY);
                    
                    // Clamp & Output (uchar)
                    let idx = (y * w + x) * 4;
                    outputPixels[idx] = outputPixels[idx+1] = outputPixels[idx+2] = magnitude > 255 ? 255 : magnitude;
                    outputPixels[idx + 3] = 255; // Alpha
                }
            }

            ctx.putImageData(outputData, 0, 0);
            requestAnimationFrame(render);
        }
    </script>
</body>
</html>
